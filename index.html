<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EDU Course Outline Tool – Prototype (Output C)</title>
<style>
:root{color-scheme:light;--bg:#fff;--card:#fff;--tx:#1b2433;--mut:#566074;--pri:#3d5a96;--prit:#fff;--bd:#aab3c5;--ok:#1e7a3c;--okb:#dff3e5;--er:#b3261e;--erb:#fbe3e1;--gr:#d9dde5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:none){:root:not([data-theme="light"]){--bg:#12161f;--card:#1b2130;--tx:#eef1f7;--mut:#a9b3c7;--pri:#8fa9e6;--prit:#0d1424;--bd:#4a5570;--ok:#7fd69a;--okb:#16301f;--er:#ff9b93;--erb:#3b1a18;--gr:#2b3446}}
:root[data-theme="x"]{--bg:#12161f;--card:#1b2130;--tx:#eef1f7;--mut:#a9b3c7;--pri:#8fa9e6;--prit:#0d1424;--bd:#4a5570;--ok:#7fd69a;--okb:#16301f;--er:#ff9b93;--erb:#3b1a18;--gr:#2b3446}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
body.lofi{--bg:#fff;--card:#fff;--tx:#000;--mut:#444;--pri:#777;--prit:#fff;--bd:#555;--ok:#222;--okb:#eee;--er:#222;--erb:#eee;--gr:#ddd;filter:grayscale(1);font-family:"Courier New",monospace}
.lofi *{border-radius:0!important}.lofi .card,.lofi .dz,.lofi .pop{border:2px dashed #555}.lofi .logo{font-family:inherit;border:2px solid #000;padding:0 8px}
button,input,select{font:inherit;color:inherit}:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
.pb0{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:6px 12px;background:#222;color:#fff;font-size:.8rem}.pb0 select,.pb0 button{min-height:32px;background:#fff;color:#000;border:0;border-radius:4px;padding:0 8px}
.hd{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--bd);background:var(--card)}.hd h1{font-size:1.15rem;margin:0}.sp{flex:1}
.logo{font:700 1.9rem Georgia,serif;color:var(--pri);letter-spacing:1px}.logo.big{font-size:3rem;text-align:center}
.ic,.av{min-width:44px;min-height:44px;border-radius:50%;border:1px solid var(--bd);background:var(--card);cursor:pointer;position:relative}.av{background:var(--pri);color:var(--prit);font-weight:600}
.bd{position:absolute;top:-4px;right:-4px;background:var(--er);color:#fff;border-radius:50%;font-size:.7rem;min-width:18px;height:18px;line-height:18px}
.rel{position:relative}.pop{position:absolute;right:0;top:110%;z-index:5;width:min(320px,86vw);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:12px;box-shadow:0 4px 14px #0004}
.lay{display:grid;grid-template-columns:180px 1fr;min-height:60vh}nav{padding:12px;border-right:1px solid var(--bd);display:flex;flex-direction:column;gap:4px}
nav button{text-align:left;min-height:44px;border:0;background:none;border-radius:6px;cursor:pointer;padding:0 10px}nav button[aria-current=page]{background:var(--gr);font-weight:700;border-left:4px solid var(--pri)}
main{padding:16px;min-width:0}h2{margin:.2em 0 .6em;color:var(--pri)}h3{margin:.2em 0}
.btn{min-height:44px;padding:0 16px;border:1px solid var(--bd);border-radius:6px;background:var(--gr);cursor:pointer;font-weight:600}.btn.pri{background:var(--pri);color:var(--prit);border-color:var(--pri)}.btn.ok{background:var(--okb);border-color:var(--ok)}.btn.er{background:var(--erb);border-color:var(--er)}.btn:disabled{opacity:.5;cursor:not-allowed}
.lnk{background:none;border:0;text-decoration:underline;color:var(--pri);cursor:pointer;min-height:44px;padding:0 4px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:12px}.cards{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.cards>.card{flex:1 1 150px}.cards>.wide{flex:2 1 240px}
.dcard{text-align:left;display:flex;flex-direction:column;cursor:pointer;color:inherit}.two{display:grid;grid-template-columns:1fr 280px;gap:16px}.rw{display:flex;justify-content:space-between;align-items:center}.row{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
.cols{display:grid;grid-template-columns:1fr 1fr 190px;gap:12px}.mut{color:var(--mut);font-size:.88rem}.it{margin:8px 0;padding-bottom:8px;border-bottom:1px solid var(--gr)}
.msg{padding:8px 12px;border-radius:6px;border:1px solid var(--bd);margin:8px 0}.msg.ok{background:var(--okb);border-color:var(--ok)}.msg.er{background:var(--erb);border-color:var(--er)}
label{display:block;font-weight:600;margin-top:10px}input[type=text],input[type=email],input[type=password],input[type=date],select{width:100%;min-height:44px;padding:0 10px;border:1px solid var(--bd);border-radius:6px;background:var(--card)}
input[type=checkbox]{width:22px;height:22px;vertical-align:middle}.chk{display:flex;gap:8px;align-items:center;font-weight:400;margin:6px 0;min-height:36px}
.ai{background:var(--gr);border-radius:10px;padding:0 7px;font-size:.75rem;font-weight:700}.st{margin-left:auto;font-size:.8rem;font-weight:700}
.dz{border:2px dashed var(--bd);border-radius:8px;padding:18px;text-align:center}.dz.on{background:var(--okb)}.fl{list-style:none;padding:0}.fl li{padding:6px 0}
.pb{height:12px;border:1px solid var(--bd);margin-top:6px}.pb i{display:block;height:100%;background:var(--pri);animation:f 1.2s linear forwards}@keyframes f{from{width:0}to{width:100%}}
.ctr{max-width:380px;margin:30px auto;padding:0 16px}.h2{font-size:1.4rem}
.dn{width:90px;height:90px;border-radius:50%;background:conic-gradient(var(--ok) calc(var(--p)*1%),var(--gr) 0);display:grid;place-items:center;margin:6px auto}.dn span{background:var(--card);border-radius:50%;width:56px;height:56px;display:grid;place-items:center;font-weight:700}
.bars{display:flex;gap:6px;align-items:flex-end;height:130px;border-bottom:2px solid var(--bd);padding-top:10px}.bars div{flex:1;text-align:center;font-size:.72rem}.bars i{display:block;background:var(--pri);margin:2px auto 0;width:60%;min-height:2px}
.pg{height:14px;border:1px solid var(--bd);margin:2px 0 8px}.pg i{display:block;height:100%;background:var(--pri)}.stats{display:flex;gap:10px;flex-wrap:wrap}.stats .card{flex:1 1 130px;text-align:center}.stats b{font-size:1.5rem;display:block}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;font-size:.8rem}.cd{border:1px solid var(--gr);min-height:46px;padding:2px;overflow:hidden}.cd.td{border:2px solid var(--pri);font-weight:700}.cd em{display:block;font-size:.62rem;font-style:normal;color:var(--er)}
.rules{font-size:.82rem;color:var(--mut)}.tg{position:fixed}
#toast{position:fixed;left:50%;bottom:calc(60px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:8px;z-index:9;max-width:90vw}
footer{padding:12px 16px;text-align:center;font-size:.8rem;color:var(--mut);border-top:1px solid var(--bd)}
.btn{background:#bcbcbc;color:#111;border:1px solid #444}.btn.ok{background:#a9dc9b;border-color:#2f6b2a}.btn.er{background:#d4645c;border-color:#7a1f1a}.av{background:#3b5778;color:#fff}.pill{background:#4a6fb5!important;color:#fff!important;border-radius:999px;border-color:#4a6fb5!important;min-width:200px}h2{color:var(--tx)}.dh{font-family:Georgia,serif;color:#3d5a96!important}.pg,.pb{border:2px solid #111;background:#fff}.bars i{background:#5b7cc4;border:1.5px solid #111}#toast{background:#bcbcbc;color:#111;border:1px solid #444}.card{border-color:#9aa3b5}body{background:#fff}.mob{display:none}
@media(max-width:760px){.lay,.two,.cols{grid-template-columns:1fr}.mob{display:inline-block}nav{display:none;border-right:0;border-bottom:1px solid var(--bd)}nav.open{display:flex}}
</style></head><body>
<div class="pb0"><b>Prototype – Output C (v3)</b><span>All data fictional · AI &amp; processing simulated · Today = Oct 6, 2026</span><span class="sp"></span>
<label style="margin:0;font-weight:400">Screen <select id="jmp" aria-label="Jump to screen"></select></label><button id="lf" aria-pressed="false">Low-fi view</button><button id="rs">Reset</button></div>
<div id="app"></div><div id="toast" role="status" hidden></div>
<footer>Sample prototype for learning and educational purposes only. Not for commercial use or commercial testing.</footer>
<script>
const $=s=>document.querySelector(s),E=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const TODAY='2026-10-06',D=s=>new Date(s+'T12:00'),sh=s=>D(s).toLocaleDateString('en-US',{month:'short',day:'numeric'}),lg=s=>D(s).toLocaleDateString('en-US',{month:'long',day:'numeric'}),days=(s,t=TODAY)=>Math.round((D(s)-D(t))/864e5);
const CRS=['COMP353','SOEN357','COMP352','COMP335'],PRG={SOEN357:65,COMP353:40,COMP352:75,COMP335:30},WD=['Su','Mo','Tu','We','Th','Fr','Sa'];
const SG0=[['COMP353','Study chapter(s) by Oct 8'],['COMP353','Study chapter(s) by Oct 10'],['COMP353','Midterm review on Oct 11'],['SOEN357','Study chapter(s) by Oct 10'],['SOEN357','Study chapter(s) by Oct 12'],['SOEN357','Midterm review on Oct 13'],['COMP352','Part 1 completed by Oct 14'],['COMP352','Part 2 completed by Oct 15'],['COMP352','Project phase 1 review on Oct 16']];
const mk=()=>({v:'login',au:0,em:'pc@live.concordia.ca',lerr:'',fem:'',fmsg:'',files:[],busy:0,bell:0,menu:0,
dl:[{id:'c353',c:'COMP353',n:'Midterm',p:25,d:'2026-10-12',ch:'Chapter 1 to 5',r:{d:'2026-10-10',h:'9',m:'00',a:'AM'}},{id:'s357',c:'SOEN357',n:'Midterm',p:35,d:'2026-10-14',ch:'Chapter 1 to 6',r:null},{id:'c352',c:'COMP352',n:'Project Phase 1',p:5,d:'2026-10-16',ch:'',r:null}],
note:['c353'],ed:0,dr:{},dmsg:'',sg:SG0.map((a,i)=>({c:a[0],t:a[1],sel:i<8,st:''})),hist:[],edSg:0,smsg:'',rem:null,rmsg:null,fc:'All courses',fr:'This week',
ses:[{c:'COMP353',d:'2026-10-04',m:180},{c:'COMP352',d:'2026-10-04',m:180},{c:'COMP353',d:'2026-10-05',m:180},{c:'COMP352',d:'2026-10-06',m:90},{c:'COMP335',d:'2026-10-06',m:90},{c:'SOEN357',d:'2026-09-29',m:120}],
tasks:[{t:'COMP353 – Study Chapters 4–5',d:1},{t:'COMP353 – Study Chapter 6',d:0},{t:'SOEN357 – Review Chapters 1–3',d:1},{t:'COMP352 – Draft Part 1',d:0}],sv:0});
let S=mk();
const rt=r=>`${lg(r.d)} at ${r.h}:${r.m} ${r.a}`,hm=m=>{const h=Math.floor(m/60),n=m%60;return(h?h+(h>1?' hours':' hour'):'')+(h&&n?' ':'')+(n?n+' minutes':'')};
const toast=t=>{const e=$('#toast');e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,4000)};
const NAV=[['dash','Dashboard'],['outline','Course Outline Tool'],['deadlines','Deadlines'],['progress','Progress']];
const shell=(t,body,nav)=>`<header class="hd"><button class="ic mob" data-a="nav" aria-label="Menu" aria-expanded="${!!S.nav}">☰</button><div class="logo">EDU</div><h1 id="h1" tabindex="-1">${t}</h1><div class="sp"></div>
<div class="rel"><button class="ic" data-a="bell" aria-label="Notifications, ${S.note.length} unread" aria-expanded="${!!S.bell}">🔔${S.note.length?`<b class="bd">${S.note.length}</b>`:''}</button>${S.bell?bellPop():''}</div>
<div class="rel"><button class="av" data-a="menu" aria-label="Account menu" aria-expanded="${!!S.menu}">PC</button>${S.menu?`<div class="pop" role="menu"><button class="lnk" data-a="toast" data-p="Account page is not part of this prototype">👤 Account</button><br><button class="lnk" data-a="toast" data-p="Settings page is not part of this prototype">⚙ Settings</button><br><button class="lnk" data-a="logout">➜ Log out</button></div>`:''}</div></header>
<div class="lay"><nav aria-label="Main" class="${S.nav?'open':''}">${NAV.map(n=>`<button data-a="go" data-p="${n[0]}" ${n[0]===nav?'aria-current="page"':''}>${n[1]}</button>`).join('')}</nav><main>${body}</main></div>`;
const bellPop=()=>`<div class="pop" role="dialog" aria-label="Notifications"><h3>Notifications</h3><p class="mut">Today: October 10, 2026 (simulated)</p>${S.note.length?S.note.map(id=>{const d=S.dl.find(x=>x.id===id);return`<div class="card"><b>${sh(d.d)} – ${d.c} ${d.n}*</b><p>Remaining days: ${days(d.d,'2026-10-10')} days<br>Reminder set to: ${d.r?rt(d.r):''}</p><div class="row"><button class="btn" data-a="viewEv">View event</button><button class="btn" data-a="dism" data-p="${id}">Dismiss</button></div></div>`}).join(''):'<p>No new notifications.</p>'}<p class="mut">*Notification is simulated</p></div>`;
const donut=()=>{const p=Math.round(S.tasks.filter(t=>t.d).length/S.tasks.length*100);return`<div class="dn" style="--p:${p}" role="img" aria-label="${p}% of tasks done"><span>${p}%</span></div>`};
const wk=(fc,fr)=>{const[a,b]=fr==='This week'?['2026-10-04','2026-10-10']:['2026-09-27','2026-10-03'],o=[0,0,0,0,0,0,0];S.ses.filter(x=>x.d>=a&&x.d<=b&&(fc==='All courses'||x.c===fc)).forEach(x=>o[D(x.d).getDay()]+=x.m);return o};
const bars=a=>`<div class="bars" role="img" aria-label="Study hours per day: ${a.map((m,i)=>WD[i]+' '+(m/60)+'h').join(', ')}">${a.map((m,i)=>`<div>${m?m/60+'h':''}<i style="height:${Math.min(m/60*14,100)}px"></i>${WD[i]}</div>`).join('')}</div>`;
const cal=()=>{const mm={};S.dl.forEach(d=>mm[+d.d.slice(8)]=d.c);let c='';for(let i=0;i<4;i++)c+='<i></i>';for(let n=1;n<=31;n++)c+=`<div class="cd${n==6?' td':''}">${n}${mm[n]?`<em>● ${mm[n]}</em>`:''}</div>`;return`<aside class="card"><h3>October 2026</h3><p class="mut">Today: October 6, 2026</p><div class="cal">${WD.map(x=>`<b>${x}</b>`).join('')}${c}</div></aside>`};
const V={
login:()=>`<div class="ctr"><div class="logo big">EDU</div><h1 id="h1" tabindex="-1" class="h2">Log in</h1><form id="login" novalidate><label for="em">Email address</label><input id="em" type="email" value="${E(S.em)}" autocomplete="username"><label for="pw">Password</label><input id="pw" type="password" placeholder="Enter your password" autocomplete="current-password"><div class="row"><button class="btn pri">Login</button><button type="button" class="btn" data-a="clr">Cancel</button></div><button type="button" class="lnk" data-a="go" data-p="forgot">Forgot password?</button><p class="msg er" role="alert" ${S.lerr?'':'hidden'}>⛔ ${E(S.lerr)}</p><p class="mut">Prototype: any password works. Type “wrong” to see the error state.</p></form></div>`,
forgot:()=>`<div class="ctr"><div class="logo big">EDU</div><h1 id="h1" tabindex="-1" class="h2">Reset your Password</h1><p>Enter the email address associated with your EDU account to request a password-reset link.</p><form id="forgot" novalidate><label for="fe">Email address</label><input id="fe" type="email" value="${E(S.fem)}"><div class="row"><button class="btn pri">Send Reset Link</button><button type="button" class="btn" data-a="go" data-p="login">Cancel</button></div></form><p class="msg ${S.fmsg.startsWith('Enter')?'er':'ok'}" role="status" ${S.fmsg?'':'hidden'}>${S.fmsg.startsWith('Enter')?'⛔':'✉'} ${S.fmsg}</p></div>`,
dash:()=>shell('Welcome, Paul!',`<h2 class="dh">My Dashboard</h2><div class="two"><div><section><div class="rw"><h3>Upcoming deadlines</h3><button class="lnk" data-a="go" data-p="deadlines">More…</button></div><div class="cards">${S.dl.map(d=>`<button class="card dcard" data-a="go" data-p="deadlines"><b>${d.c}</b><span>${d.n} (${d.p}%)</span><small>${sh(d.d)}</small></button>`).join('')}</div></section><section><div class="rw"><h3>Study Analytics</h3><button class="lnk" data-a="go" data-p="progress">More…</button></div><div class="cards"><div class="card"><b>Tasks</b>${donut()}</div><div class="card wide"><b>This week</b> · Streak: 14 days 🔥${bars(wk('All courses','This week'))}</div></div></section></div>${cal()}</div>`,'dash'),
outline:()=>{const ok=S.files.some(f=>f.ok);return shell('Course Outline Tool',`<div id="dz" class="dz"><p><b>Drag and drop files here</b></p><p class="mut">FILE SPECIFICATIONS<br>.pdf file accepted<br>Maximum file size: 10 MB</p><p>Or</p>${S.busy?'<div class="pb" role="progressbar" aria-label="Upload progress"><i></i></div>':''}<button class="btn pill" data-a="browse">Browse computer</button> <button class="btn" data-a="sample">Use sample files (simulated)</button><input id="fi" type="file" accept=".pdf,application/pdf" multiple hidden></div>
${S.busy?`<div class="msg" role="status">Reading course outline… Extracting deadlines and study information.</div>`:''}<ul class="fl" aria-live="polite">${S.files.map(f=>`<li>${f.ok?'✅':'⛔'} <b>${E(f.n)}</b> – ${f.ok?'Uploaded successfully':'Upload failed'}${f.ok?'':`<br><small>${E(f.e)}</small>`}</li>`).join('')}</ul>${!S.files.length&&!S.busy?'<p class="mut">No course outline uploaded yet. Drop a PDF or use the sample files.</p>':''}<div class="row"><button class="btn" data-a="go" data-p="suggest" ${ok&&!S.busy?'':'disabled'}>Continue to Study suggestion</button><button class="btn" data-a="cancelUp">Cancel upload</button></div>`,'outline')},
suggest:()=>{const sv=S.sg.filter(x=>x.st=='saved').length,rj=S.sg.filter(x=>x.st=='rejected').length,stx={'':'Selected','saved':'✓ Saved','rejected':'✕ Rejected'};
return shell('Course Outline Tool',`<div class="cols"><div class="card"><h2>Upcoming deadlines</h2><p><b>Today: October 6, 2026</b></p>${S.dl.map(d=>`<div class="it"><b>${d.c} ${d.n} (${d.p}% of your final grade)</b> <button class="lnk" data-a="edDl" aria-label="Edit ${d.c} deadline">✎</button>${S.ed?`<label>Deadline date<input type="date" data-c="dd" data-p="${d.id}" value="${S.dr[d.id]}"></label>`:`<div>${sh(d.d)} · Remaining days: ${days(d.d)} days</div>`}</div>`).join('')}<div class="row"><button class="btn" data-a="edDl">Edit</button><button class="btn ok" data-a="svDl">Save deadlines</button><button class="btn er" data-a="cnDl">Cancel</button></div><p class="msg ${S.dmsg.includes('Invalid')?'er':'ok'}" role="status" ${S.dmsg?'':'hidden'}>${E(S.dmsg)}</p><p class="mut">EDU uses AI to extract information. Please review results for possible errors.</p></div>
<div class="card"><h2>Study suggestion</h2>${['COMP353','SOEN357','COMP352'].map(c=>`<b>${c}</b> <small>Selected or <span style="color:var(--ok)">Saved</span> or <span style="color:var(--er)">Rejected</span></small>${S.sg.map((x,i)=>x.c===c?`<div class="chk"><input type="checkbox" id="g${i}" data-c="sel" data-p="${i}" ${x.sel?'checked':''} aria-label="Select: ${E(x.t)}"><span class="ai">AI</span>${S.edSg?`<input type="text" data-c="stx" data-p="${i}" value="${E(x.t)}" aria-label="Edit suggestion">`:`<label for="g${i}" class="chk" style="margin:0">${E(x.t)}</label>`}<span class="st">${x.st?stx[x.st]:x.sel?'Selected':'—'}</span></div>`:'').join('')}`).join('')}<p class="msg er" role="alert" ${S.smsg?'':'hidden'}>⛔ ${S.smsg}</p><p class="mut">Suggestions may contain errors. Review before saving.</p><button class="lnk" data-a="go" data-p="ai">How EDU uses AI</button></div>
<div style="display:flex;flex-direction:column;gap:8px"><button class="btn" data-a="edSg">${S.edSg?'Done editing':'Edit study suggestions'}</button><button class="btn" data-a="toast" data-p="Edit classes is not included in this prototype (limitation)">Edit classes</button><button class="btn" data-a="go" data-p="outline">Cancel</button><p role="status">✅ ${sv} study suggestions saved<br>or<br>🗑 ${rj} study suggestions rejected</p><button class="btn" data-a="undo" ${S.hist.length?'':'disabled'}>Undo</button></div></div><div class="row" style="justify-content:flex-end"><button class="btn" data-a="selAll">Select all / Deselect all</button><button class="btn ok" data-a="saveSg">Save item(s)</button><button class="btn er" data-a="rejSg">Reject item(s)</button></div>`,'outline')},
ai:()=>shell('How EDU Uses AI?',`${[['How does it work?','EDU uses AI to read uploaded course outlines, identify important dates and suggest study activities based on the information in those documents.'],['Can the AI make mistakes?','Yes. EDU may extract an incorrect deadline or suggest a study activity that doesn’t fit your availability. Always check important information against your original course outline.'],['Can I change the suggestions?','Yes. You can correct extracted deadlines and edit, save or reject AI-generated study suggestions before adding them to your planner.']].map(a=>`<section class="card" style="margin-bottom:10px"><h2>${a[0]}</h2><p>${a[1]}</p></section>`).join('')}<p class="mut">In this prototype the AI extraction is simulated with fictional data.</p><button class="btn" data-a="go" data-p="suggest">Return to Course Outline Tool</button>`,'outline'),
deadlines:()=>shell('Upcoming deadlines',`<div class="cols" style="grid-template-columns:1fr 240px"><div>${S.dl.map(d=>`<section class="card" style="margin-bottom:10px;position:relative"><b>${d.c}</b><br>${d.n} (${d.p}%)${d.ch?`<br>– ${d.ch}`:''}<br><small>Due ${lg(d.d)}</small>
${d.r&&S.rem!==d.id?`<div class="card" style="margin-top:8px"><b>Reminder set to:</b><br>${rt(d.r)}</div><button class="lnk" data-a="rem" data-p="${d.id}">Edit reminders</button><button class="lnk" data-a="off" data-p="${d.id}">Turn off reminders</button>`:''}${!d.r&&S.rem!==d.id?`<div><button class="lnk" data-a="rem" data-p="${d.id}">Set a reminder</button></div>`:''}${S.rem===d.id?remForm(d):''}</section>`).join('')}</div><div><button class="btn" data-a="go" data-p="dash">Return to dashboard</button>${S.rmsg?`<p class="msg ${S.rmsg[0]}" role="status">${S.rmsg[0]=='ok'?'✅':'⛔'} ${E(S.rmsg[1])}</p>`:''}</div></div>`,'deadlines'),
progress:()=>{const[a,b]=S.fr==='This week'?['Oct 4','Oct 10']:['Sep 27','Oct 3'],f=wk(S.fc,S.fr),tot=f.reduce((x,y)=>x+y,0),sel=(id,l,o)=>`<label for="${id}" style="margin:0" class="mut">${l}</label><select id="${id}" data-c="${id}" style="min-width:150px">${o.map(x=>`<option ${x===S[id]?'selected':''}>${x}</option>`).join('')}</select>`;
return shell('Study Analytics',`<div class="row" style="align-items:end">${sel('fc','Course',['All courses',...CRS])}${sel('fr','Range',['This week','Last week'])}<button class="btn" data-a="go" data-p="dash">Return to dashboard</button><button class="btn pri" data-a="go" data-p="record">Record study activity</button></div>
${tot?`<div class="stats"><div class="card"><b>42%</b>Semester progress</div><div class="card"><b>${+(tot/60).toFixed(1)}h</b>Study hours (${S.fr.toLowerCase()})</div><div class="card"><b>14 days 🔥</b>Study streak</div></div><div class="cards" style="margin-top:12px"><div class="card wide"><b>${S.fr}</b> · ${a} – ${b}${bars(f)}</div><div class="card wide"><div class="rw"><b>Course Progress</b><button class="lnk" data-a="toast" data-p="Classes page is not part of this prototype">View classes</button></div>${(S.fc==='All courses'?CRS:[S.fc]).map(c=>`<div>${c} – ${PRG[c]}%<div class="pg"><i style="width:${PRG[c]}%"></i></div></div>`).join('')}</div></div>
<div class="cards"><div class="card"><div class="rw"><b>Upcoming deadlines</b><button class="lnk" data-a="go" data-p="deadlines">More…</button></div>${S.dl.map(d=>`<p>${d.c} ${d.n} – ${sh(d.d)}</p>`).join('')}</div><div class="card"><div class="rw"><b>Tasks</b><button class="lnk" data-a="toast" data-p="Full task list is not part of this prototype">More…</button></div>${S.tasks.map((t,i)=>`<label class="chk"><input type="checkbox" data-c="task" data-p="${i}" ${t.d?'checked':''}>${E(t.t)}</label>`).join('')}${donut()}</div></div>`
:`<div class="card" style="text-align:center;padding:30px"><p><b>No study activity found for the selected course and time range. Try changing your filters or recording a study session.</b></p><button class="btn pri" data-a="go" data-p="record">Record study activity</button></div>`}`,'progress')},
record:()=>shell('Record Study Activity',`<form id="rec" novalidate style="max-width:520px"><label for="rc">Select courses</label><select id="rc">${CRS.map(c=>`<option ${c===(S.fc==='All courses'?'SOEN357':S.fc)?'selected':''}>${c}</option>`).join('')}</select>
<label for="rd">Study date</label><input id="rd" type="date" value="${TODAY}"><p class="msg er" id="e1" role="alert" hidden></p>
<label>Study duration</label><div class="row"><select id="rh" aria-label="Hours">${Array.from({length:25},(_,i)=>`<option value="${i}" ${i==1?'selected':''}>${i} Hour${i==1?'':'s'}</option>`).join('')}</select><select id="rm" aria-label="Minutes">${[0,15,30,45].map(m=>`<option value="${m}">${m} Minutes</option>`).join('')}</select></div><p class="msg er" id="e2" role="alert" hidden></p>
<div class="row"><button class="btn ok" id="sv">Save activity</button><button type="button" class="btn" data-a="go" data-p="progress">Cancel</button><button type="button" class="btn" data-a="go" data-p="dash">Return to dashboard</button></div>
<ul class="rules"><li>Study date can not be in the future</li><li>Study date within the last 2 weeks (prototype limit)</li><li>Study duration must be greater than 0 minutes</li><li>Study duration can not exceed 24 hours</li></ul></form>`,'progress')};
const remForm=d=>{const r=d.r||{d:d.d<'2026-10-12'?d.d:'2026-10-12',h:'9',m:'00',a:'AM'};return`<div class="card" style="position:absolute;right:10px;top:65%;z-index:4;width:min(330px,calc(100% - 20px));box-shadow:0 4px 14px #0005"><b>Set a reminder: ${d.c} ${d.n}</b><form id="remf" data-id="${d.id}" novalidate><label for="rmd">Reminder date</label><input id="rmd" type="date" value="${r.d}"><div class="row"><div><label for="rmh">Hour</label><select id="rmh">${Array.from({length:12},(_,i)=>`<option ${+r.h==i+1?'selected':''}>${i+1}</option>`).join('')}</select></div><div><label for="rmm">Minute</label><select id="rmm">${['00','15','30','45'].map(m=>`<option ${r.m==m?'selected':''}>${m}</option>`).join('')}</select></div><div><label for="rma">AM/PM</label><select id="rma"><option ${r.a=='AM'?'selected':''}>AM</option><option ${r.a=='PM'?'selected':''}>PM</option></select></div></div><div class="row"><button type="button" class="btn" data-a="remX">Cancel</button><button class="btn ok">Save</button></div></form></div>`};
const R=()=>{$('#app').innerHTML=V[S.v]();$('#jmp').value=S.v;if(S.v==='outline'){}};
const go=v=>{S.v=v;S.nav=0;S.bell=S.menu=0;if(v!=='deadlines'){S.rem=null;S.rmsg=null}if(v==='suggest'){S.dmsg='';S.smsg=''}R();const h=$('#h1');h&&h.focus();scrollTo(0,0)};
const proc=fl=>{const a=[...fl].map(f=>({n:f.name,s:f.size}));if(!a.length)return;S.busy=1;R();setTimeout(()=>{a.forEach(f=>{const ex=S.files.some(x=>x.n===f.n&&x.ok);S.files.push(!/\.pdf$/i.test(f.n)?{n:f.n,ok:0,e:'Only .pdf files are accepted. Please choose a PDF.'}:f.s>10*1048576?{n:f.n,ok:0,e:'File exceeds 10 MB. Please choose a smaller PDF and try again.'}:ex?{n:f.n,ok:0,e:'This file was already uploaded.'}:{n:f.n,ok:1})});S.busy=0;R()},1200)};
const A={nav:()=>{S.nav=!S.nav;R()},go:p=>go(p),toast:p=>toast(p),clr:()=>{S.em='';S.lerr='';R()},bell:()=>{S.bell=!S.bell;S.menu=0;R()},menu:()=>{S.menu=!S.menu;S.bell=0;R()},logout:()=>{S.au=0;go('login')},
dism:p=>{S.note=S.note.filter(x=>x!==p);R()},viewEv:()=>go('deadlines'),browse:()=>$('#fi').click(),sample:()=>proc([{name:'COMP353_CourseOutline.pdf',size:2e6},{name:'SOEN357_CourseOutline.pdf',size:3e6},{name:'COMP352_CourseOutline.pdf',size:12e6}]),cancelUp:()=>{S.files=[];S.busy=0;R();toast('Upload cancelled. No files kept.')},
edDl:()=>{S.ed=1;S.dr={};S.dl.forEach(d=>S.dr[d.id]=d.d);S.dmsg='';R()},cnDl:()=>{S.ed=0;S.dmsg='';R()},
svDl:()=>{if(!S.ed){S.dmsg='No changes to save.';return R()}const bad=S.dl.find(d=>!S.dr[d.id]||S.dr[d.id]<TODAY);if(bad){S.dmsg='Invalid deadline date for '+bad.c+'. Choose a date today or later.';return R()}S.dl.forEach(d=>d.d=S.dr[d.id]);S.ed=0;S.dmsg='Deadlines saved.';R()},
edSg:()=>{S.edSg=!S.edSg;R()},selAll:()=>{const all=S.sg.every(x=>x.sel);S.sg.forEach(x=>x.sel=!all);R()},
snap:()=>S.hist.push(JSON.stringify({sg:S.sg,tasks:S.tasks})),
saveSg:()=>{const s=S.sg.filter(x=>x.sel);if(!s.length){S.smsg='Select at least one suggestion first.';return R()}A.snap();S.smsg='';s.forEach(x=>{x.st='saved';x.sel=false;S.tasks.push({t:x.c+' – '+x.t,d:0})});R();toast(s.length+' study suggestions saved to your tasks')},
rejSg:()=>{const s=S.sg.filter(x=>x.sel);if(!s.length){S.smsg='Select at least one suggestion first.';return R()}A.snap();S.smsg='';s.forEach(x=>{x.st='rejected';x.sel=false});R()},
undo:()=>{const h=JSON.parse(S.hist.pop());S.sg=h.sg;S.tasks=h.tasks;R()},
rem:p=>{S.rem=p;S.rmsg=null;R()},remX:()=>{S.rem=null;R()},off:p=>{S.dl.find(d=>d.id===p).r=null;S.note=S.note.filter(x=>x!==p);S.rmsg=['ok','Reminder turned off'];R()}};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&!b.disabled){A[b.dataset.a](b.dataset.p)}else if(!e.target.closest('.rel')&&(S.bell||S.menu)){S.bell=S.menu=0;R()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&(S.bell||S.menu)){S.bell=S.menu=0;R()}});
document.addEventListener('change',e=>{const t=e.target,c=t.dataset.c,p=t.dataset.p;if(t.id==='fi')return proc(t.files);if(t.id==='jmp'){if(t.value!=='login'&&t.value!=='forgot')S.au=1;return go(t.value)}
if(c==='sel')S.sg[p].sel=t.checked;else if(c==='stx')S.sg[p].t=t.value;else if(c==='dd')S.dr[p]=t.value;else if(c==='task'){S.tasks[p].d=t.checked?1:0}else if(c==='fc'||c==='fr'){S[c]=t.value;R()}});
document.addEventListener('dragover',e=>{if(e.target.closest('#dz')){e.preventDefault();$('#dz').classList.add('on')}});
document.addEventListener('dragleave',e=>{const z=$('#dz');z&&z.classList.remove('on')});
document.addEventListener('drop',e=>{if(e.target.closest('#dz')){e.preventDefault();proc(e.dataTransfer.files)}});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target.id;
if(f==='login'){S.em=$('#em').value.trim();const pw=$('#pw').value;S.lerr=!/^\S+@\S+\.\S+$/.test(S.em)?'Enter a valid email address.':!pw?'Please enter your password.':pw==='wrong'?'Invalid email address or password':'';if(S.lerr)return R();S.au=1;go('dash')}
if(f==='forgot'){S.fem=$('#fe').value.trim();S.fmsg=/^\S+@\S+\.\S+$/.test(S.fem)?'<b>Password reset link requested</b><br>If an account exists for this email address, password-reset instructions will be sent.':'Enter a valid email address.';R()}
if(f==='remf'){const d=S.dl.find(x=>x.id===e.target.dataset.id),v=$('#rmd').value;if(!v)S.rmsg=['er','Please select a reminder date.'];else if(v>d.d)S.rmsg=['er','Invalid reminder date. Please select a date before the deadline.'];else if(v<TODAY)S.rmsg=['er','Invalid reminder date. The date can’t be in the past.'];else{d.r={d:v,h:$('#rmh').value,m:$('#rmm').value,a:$('#rma').value};S.rmsg=['ok','Reminder saved for '+rt(d.r)];S.rem=null}R()}
if(f==='rec'){const d=$('#rd').value,h=+$('#rh').value,m=+$('#rm').value,t=h*60+m,e1=$('#e1'),e2=$('#e2');let bad=0;
const sh1=x=>{e1.hidden=0;e1.textContent='⛔ '+x;bad=1},sh2=x=>{e2.hidden=0;e2.textContent='⛔ '+x;bad=1};e1.hidden=e2.hidden=1;
if(!d)sh1('No date selected');else if(d>TODAY)sh1('Invalid date: the study date can’t be in the future');else if(d<'2026-09-27')sh1('Invalid date: choose a date within the last 2 weeks');
if(t<=0)sh2('Invalid duration: must be greater than 0 minutes');else if(t>1440)sh2('Invalid duration: can’t exceed 24 hours');
if(bad){(bad&&!e1.hidden?$('#rd'):$('#rh')).focus();return}
$('#sv').disabled=true;const c=$('#rc').value;S.ses.push({c,d,m:t});S.fc=c;S.fr=d>='2026-10-04'?'This week':'Last week';toast('Study activity saved – '+hm(t)+' added to '+c);go('progress')}});
$('#lf').onclick=e=>{const l=document.body.classList.toggle('lofi');e.target.textContent=l?'High-fi view':'Low-fi view';e.target.setAttribute('aria-pressed',l)};
$('#rs').onclick=()=>{S=mk();document.body.classList.remove('lofi');$('#lf').textContent='Low-fi view';R();toast('Prototype reset')};
$('#jmp').innerHTML=[['login','T4 · Login'],['forgot','T4 · Forgot password'],['dash','Dashboard'],['outline','T1 · Upload outline'],['suggest','T1 · Study suggestions'],['ai','T1 · How EDU uses AI'],['deadlines','T2 · Deadlines & reminders'],['progress','T3 · Study analytics'],['record','T3 · Record activity']].map(a=>`<option value="${a[0]}">${a[1]}</option>`).join('');
